version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      flake-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # updates are auto-merged and run on main with the cache upload secrets;
    # waiting a week gives a compromised release time to be caught and pulled
    cooldown:
      default-days: 7
    groups:
      actions-dependencies:
        patterns:
          - "*"
