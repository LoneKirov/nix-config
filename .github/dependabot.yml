version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "14:00"
    groups:
      flake-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "14:00"
    groups:
      actions-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/hosts/moltres/services/**/*"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
    ignore:
      - dependency-name: "library/caddy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pocketid/pocket-id"
        update-types: ["version-update:semver-major"]
    groups:
      container-images:
        patterns:
          - "*"
